name: Windows desktop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Build and test Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - name: Validate desktop shell
        run: node --test desktop/tests/bundle.test.cjs
      - name: Build portable EXE
        run: node desktop/build.cjs
      - name: Launch and exercise EXE with CPU software rendering
        run: node desktop/tests/exe-smoke.cjs
